<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Subtle DSP Grid -->
  <path d="M 64 160 H 448 M 64 256 H 448 M 64 352 H 448 M 160 96 V 416 M 256 96 V 416 M 352 96 V 416" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Outer Rack Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.25"/>

  <!-- Crossover Filter Slopes (Low Pass + High Pass curves) -->
  <!-- Low Pass Curve (Cyan) -->
  <path d="M 70 230 C 180 230, 220 236, 250 280 C 275 320, 290 390, 310 410" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- High Pass Curve (Amber/Red) -->
  <path d="M 202 410 C 222 390, 237 320, 262 280 C 292 236, 332 230, 442 230" fill="none" stroke="url(#amberGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Crossover Node Point -->
  <circle cx="256" cy="280" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>

  <!-- VU Meter Bars (Stereo Left / Right) -->
  <g transform="translate(140, 110)">
    <!-- Left Meter -->
    <rect x="0" y="0" width="100" height="12" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="2" y="2" width="76" height="8" rx="2" fill="#10b981"/>
    <text x="-25" y="10" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900">L</text>

    <!-- Right Meter -->
    <rect x="132" y="0" width="100" height="12" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="134" y="2" width="70" height="8" rx="2" fill="#10b981"/>
    <text x="240" y="10" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900">R</text>
  </g>

  <!-- Typography DLMS -->
  <text x="256" y="455" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="6">DLMS</text>
  <text x="256" y="478" text-anchor="middle" fill="#0ea5e9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="4">VIRTUAL DSP</text>
</svg>
